    <rect x="220" y="327" width="760" height="99" rx="3" fill="none"
          stroke="#d8e2dc" stroke-width="0.8" stroke-dasharray="5 5" opacity="0.34"/>
    <text x="232" y="345" class="type-light">02 · CURRENT ALLOCATION</text>
    <text x="600" y="369" text-anchor="middle" class="focus-title">ONE ALLOCATION FOCUS</text>
    <text x="600" y="386" text-anchor="middle" class="focus-copy">Explore: one choice question, a few bounded trials, normally sequential</text>
    <text x="600" y="402" text-anchor="middle" class="focus-copy">Concentrate: one direction, valuable outcome, supported edge and return mechanism</text>
    <text x="600" y="418" text-anchor="middle" class="focus-copy">Trade off a credible alternative; protect the survival floor and life priorities</text>
  </g>

  <!-- 03 · Owned work turns direction into agency and evidence. -->
  <g id="node-choices" data-graph-role="node" data-node-id="choices" data-semantic-role="rect"
