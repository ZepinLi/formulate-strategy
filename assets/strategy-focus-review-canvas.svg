    <line x1="443" y1="490" x2="443" y2="570" stroke="#b7c5bd" stroke-width="1"/>
    <line x1="756" y1="490" x2="756" y2="570" stroke="#b7c5bd" stroke-width="1"/>
    <text x="150" y="495" class="type">03 · BUILD OWNED WORK</text>
    <text x="1050" y="495" text-anchor="end" class="micro">AGENCY · OUTPUT · FEEDBACK</text>

    <text x="286" y="528" text-anchor="middle" class="card-title">OWNED PROJECT</text>
    <text x="286" y="555" text-anchor="middle" class="card-copy">one project · or bounded trials</text>

    <text x="600" y="528" text-anchor="middle" class="card-title">REALITY CONTACT</text>
    <text x="600" y="555" text-anchor="middle" class="card-copy">research · users · observed response</text>

    <text x="913" y="528" text-anchor="middle" class="card-title">CALIBRATE THE BET</text>
    <text x="913" y="555" text-anchor="middle" class="card-copy">evidence · assumptions · dissent</text>
  </g>

