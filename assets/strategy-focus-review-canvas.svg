<text x="286" y="230" class="card-title" text-anchor="middle">Scope + stage</text>
<text x="286" y="255" class="card-copy" text-anchor="middle">objective · authority · time horizon</text>
<text x="600" y="230" class="card-title" text-anchor="middle">Enabling relationships</text>
<text x="600" y="255" class="card-copy" text-anchor="middle">what sustains the present situation</text>
