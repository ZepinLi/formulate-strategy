  <title>Strategy Focus: explore, concentrate, and adjust with evidence</title>
  <desc>Find worthwhile questions through real work. Bound exploration or select one growth focus, build owned work, distinguish compounding from valuable thresholds, and calibrate commitment while protecting life priorities and survival.</desc>
  <defs>
