      .gate { font-size: 11px; font-weight: 700; fill: #365f56; letter-spacing: 0.35px; }
      .outcome { font-size: 16px; font-weight: 700; fill: #fffdf7; letter-spacing: 0.2px; }
      .stamp-kicker { font-size: 10px; font-weight: 700; fill: #a44a3f; letter-spacing: 1.55px; }
