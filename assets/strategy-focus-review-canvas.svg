      <rect x="234" y="0" width="44" height="26" rx="13" fill="#f3efe6" stroke="#8c7d68" stroke-width="0.8"/>
      <text x="256" y="18" text-anchor="middle" class="gate">OWN</text>
      <rect x="283" y="0" width="82" height="26" rx="13" fill="#f3efe6" stroke="#8c7d68" stroke-width="0.8"/>
