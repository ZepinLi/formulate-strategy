  <!-- 01 · Directional signal from real attention, work, and problems. -->
  <g id="node-basis" data-graph-role="node" data-node-id="basis" data-semantic-role="rect"
     data-parent="strategy-canvas" data-graph-bounds="130,175,1070,280">
    <rect x="130" y="175" width="940" height="105" rx="4" fill="#fffdf7"
          stroke="#8c7d68" stroke-width="1.45"/>
    <rect data-graph-role="decoration" data-owner="node-basis"
          x="132" y="173" width="939" height="106" rx="4" fill="none"
          stroke="#8c7d68" stroke-width="0.75" opacity="0.22"/>
    <line x1="443" y1="190" x2="443" y2="265" stroke="#c9bda9" stroke-width="1"/>
    <line x1="756" y1="190" x2="756" y2="265" stroke="#c9bda9" stroke-width="1"/>
    <text x="150" y="199" class="type">01 · DISCOVER QUESTIONS</text>

    <text x="150" y="229" class="card-title">Curiosity + real work</text>
    <text x="150" y="253" class="card-copy">Interest · output · difficult parts</text>

    <text x="463" y="229" class="card-title">Gaps worth exploring</text>
    <text x="463" y="253" class="card-copy">Anomalies · friction · open questions</text>

    <text x="776" y="229" class="card-title">Evidence + options</text>
    <text x="776" y="253" class="card-copy">Fit · learning · future choices</text>
  </g>

  <!-- 02 · A single allocation decision supports bounded exploration or concentration. -->
  <g id="node-focus" data-graph-role="node" data-node-id="focus" data-semantic-role="double_rect"
     data-parent="strategy-canvas" data-graph-bounds="210,320,990,430">
    <rect x="210" y="320" width="780" height="110" rx="5" fill="#24312f"
